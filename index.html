<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Black Business Directory — DC &amp; Baltimore</title>
<meta name="description" content="An interactive directory of Black-owned businesses and Black business owners in Washington, DC and Baltimore: a map of storefronts, a web of owners and companies, and dossiers on how each business was built.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
/* ============ TOKENS — paper (light) / ink (dark), matching the Semiconductor Earnings site ============ */
:root{
  --bg:#FAFAF7; --bg2:#F3F2EC; --text:#1F1D18; --text2:#1f1d18d9; --muted:#6B6960; --dim:#9C998E;
  --line:#E8E6DF; --line2:#D8D5CB; --accent:#8A5A2B; --accent-soft:#8a5a2b1a;
  --edge:#C4C1B6; --edge-strong:#8F8C82;
  --c-op:#3E6A8A; --c-inv:#6B5B9A; --c-his:#8A5A2B; --c-bhis:#9B3D2E; --c-tech:#3C7A5E; --c-intra:#2F7A80;
  --doc:#3C7A5E; --pattern:#8A5A2B; --scrim:#1f1d1826;
  --serif:'Iowan Old Style','Apple Garamond',Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E0E10; --bg2:#151518; --text:#E8E6DF; --text2:#e8e6dfd9; --muted:#7A7A82; --dim:#56565D;
    --line:#26262B; --line2:#34343A; --accent:#C9A875; --accent-soft:#c9a8751f;
    --edge:#36363D; --edge-strong:#5E5E66;
    --c-op:#86A8C4; --c-inv:#A99BD3; --c-his:#C9A875; --c-bhis:#E0907A; --c-tech:#7FB89B; --c-intra:#7CC3C8;
    --doc:#7FB89B; --pattern:#C9A875; --scrim:#00000099;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E0E10; --bg2:#151518; --text:#E8E6DF; --text2:#e8e6dfd9; --muted:#7A7A82; --dim:#56565D;
  --line:#26262B; --line2:#34343A; --accent:#C9A875; --accent-soft:#c9a8751f;
  --edge:#36363D; --edge-strong:#5E5E66;
  --c-op:#86A8C4; --c-inv:#A99BD3; --c-his:#C9A875; --c-bhis:#E0907A; --c-tech:#7FB89B; --c-intra:#7CC3C8;
  --doc:#7FB89B; --pattern:#C9A875; --scrim:#00000099;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.6 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-feature-settings:"kern","liga","calt";overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent);text-underline-offset:2px}
::selection{background:#c9a87533}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.mono{font-family:var(--mono)}
.lbl{font:500 10px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.14em;flex:none}

/* ============ HEADER ============ */
header.top{border-bottom:1px solid var(--line);background:var(--bg);padding:16px 24px 0;flex:none;z-index:5}
.row1{display:flex;align-items:center;gap:14px 24px;flex-wrap:wrap}
.brand{min-width:0}
.brand h1{font:400 22px/1.15 var(--serif);margin:0;letter-spacing:-.01em;white-space:nowrap}
.brand small{display:block;margin-top:4px;font:500 10px var(--mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.search{flex:1;min-width:200px;max-width:420px;position:relative;margin-left:auto}
.search input{width:100%;background:transparent;border:1px solid var(--line);border-radius:2px;padding:7px 10px 7px 30px;color:var(--text);font:13px var(--sans);outline:none;transition:border-color .15s}
.search input:focus{border-color:var(--edge-strong)}
.search input::placeholder{color:var(--dim)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font:500 10px var(--mono);color:var(--dim);border:1px solid var(--line);border-radius:2px;padding:0 5px}
.tabs{display:flex;gap:18px}
.tabs button,.theme{background:none;border:0;border-bottom:1px solid transparent;padding:4px 0;font:500 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.tabs button:hover,.theme:hover{color:var(--text)}
.tabs button[aria-pressed="true"]{color:var(--text);border-bottom-color:var(--accent)}
.row2{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px 26px;padding:12px 0 11px}
.fgroup{display:flex;align-items:baseline;gap:12px}
.seg,.chips{display:inline-flex;flex-wrap:wrap;gap:3px 13px}
.seg button,.chip{background:none;border:0;border-bottom:1px solid transparent;padding:1px 0;font:400 12.5px var(--sans);color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:color .15s}
.seg button:hover,.chip:hover{color:var(--text)}
.seg button[aria-pressed="true"],.chip[aria-pressed="true"]{color:var(--text);border-bottom-color:var(--accent)}
.chip .d{width:6px;height:6px;border-radius:50%;background:var(--c,var(--muted))}
.seg .n,.chip .n{font:500 9.5px var(--mono);color:var(--dim)}

/* ============ STAGE ============ */
main{flex:1;min-height:0;position:relative}
#map,#grid,#atlas{position:absolute;inset:0}
#map{background:var(--bg)}
#map svg{display:block;width:100%;height:100%;cursor:grab}
#map svg:active{cursor:grabbing}
#grid{overflow:auto;padding:40px 24px 64px}
[hidden]{display:none!important}

/* graph */
.link{fill:none;stroke:var(--edge);stroke-width:.9;transition:opacity .18s}
.link.dashed{stroke-dasharray:5 4}
.link.dotted{stroke-dasharray:1 3.5;stroke-linecap:round}
.link.t-tax{stroke:var(--line2)}
.link.hot{stroke:var(--accent);stroke-width:1.3;opacity:1}
.arrow{fill:var(--edge-strong)}
.elabel{font:500 8.5px var(--mono);letter-spacing:.06em;fill:var(--muted);paint-order:stroke;stroke:var(--bg);stroke-width:3px;opacity:0;pointer-events:none;transition:opacity .2s}
svg.zoomed .elabel{opacity:.85}
.node{cursor:pointer;transition:opacity .18s}
.node text{pointer-events:none;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.node.profile text{font:400 12.5px var(--serif);fill:var(--text)}
.node.profile .ring{fill:var(--bg);stroke:var(--c);stroke-width:1.2}
.node.profile .core{fill:var(--c)}
.node.profile.est .ring{stroke-dasharray:3 2.5}
.node.entity .box{fill:var(--bg);stroke:var(--edge-strong);stroke-width:1}
.node.entity text{font:500 8.5px var(--mono);letter-spacing:.08em;fill:var(--muted)}
.node.hub .box{stroke:var(--accent)}
.node.hub text{fill:var(--text);stroke:none}
.node.tax-sector .box{fill:var(--bg);stroke:var(--text);stroke-width:1}
.node.tax-sector text{font:600 11px var(--mono);letter-spacing:.14em;fill:var(--text);stroke:none}
.node.tax-sector text.tax-sub{font:400 12px var(--serif);letter-spacing:0;fill:var(--muted);stroke:var(--bg)}
.node.tax-industry .idot{fill:var(--muted)}
.node.tax-industry text{font:400 11.5px var(--serif);fill:var(--text2)}
.node.tax-sub .dot{fill:var(--bg);stroke:var(--muted)}
.node.tax-sub text{font:italic 400 11px var(--serif);fill:var(--muted)}
.node .minor{opacity:0;transition:opacity .2s}
svg.zoomed .node .minor,.node:hover .minor,.node.nb .minor,.node.sel .minor{opacity:1}
.node:hover .ring,.node:hover .box{stroke-width:1.8}
.node.sel .ring,.node.sel .box{stroke:var(--accent);stroke-width:2}
.faded{opacity:.1!important}
.dimq{opacity:.16!important}
.gics{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;font:500 10px/1.7 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 18px;padding:0 0 12px;border-bottom:1px solid var(--line)}
.gics button{background:none;border:0;padding:0;font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--text)}
.gics button:hover{color:var(--accent)}
.gics .etf{color:var(--accent);font-weight:600}
.gics .f500{color:var(--text);border:1px solid var(--line2);border-radius:2px;padding:0 5px}
.gics .b{margin-left:auto;font-size:8.5px;letter-spacing:.12em;border:1px solid var(--line2);border-radius:2px;padding:0 5px;cursor:help}
.sect{font:500 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-top:6px}

/* overlays */
.overlay{position:absolute;background:color-mix(in srgb,var(--bg) 94%,transparent);border:1px solid var(--line);border-radius:2px;padding:12px 14px;font-size:12px}
.legend{left:20px;bottom:20px;max-width:250px}
.legend h4,.ctrls h4{margin:0 0 6px;font:500 9.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.legend .it{display:flex;align-items:center;gap:9px;color:var(--text2);line-height:1.85;font-size:11.5px}
.legend .sw{width:7px;height:7px;border-radius:50%;flex:none}
.legend .sq{width:7px;height:7px;border:1px solid var(--edge-strong);flex:none}
.legend .hb{width:16px;height:8px;border:1px solid var(--accent);flex:none}
.legend .ln{width:22px;height:0;border-top:1px solid var(--edge-strong);flex:none}
.legend .extra{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.legend .sizes{display:flex;gap:10px;align-items:flex-end;color:var(--muted);font:500 8.5px var(--mono);margin-bottom:10px}
.legend .sz{display:flex;flex-direction:column;align-items:center;gap:4px}
.legend .sz i{display:block;border:1px solid var(--muted);border-radius:50%}
.ctrls{right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px}
.ctrls .btns{display:flex;gap:16px}
.ibtn{background:none;border:0;padding:2px 0;font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ibtn:hover{color:var(--text)}
.ibtn.ovl[aria-pressed="true"]{color:var(--accent)}
.hint{left:50%;top:14px;transform:translateX(-50%);border:0;background:none;padding:0;font:500 9.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);text-align:center;pointer-events:none;font-family:var(--serif)}

/* ============ GRID ============ */
.gridhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;max-width:1120px;margin:0 auto 22px;flex-wrap:wrap}
.gridhead h2{margin:0;font:400 32px/1.15 var(--serif);letter-spacing:-.015em}
.gridhead .meta{font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));max-width:1120px;margin:0 auto;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.card{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px 18px 16px;cursor:pointer;outline:none;transition:background .15s}
.card:hover,.card:focus-visible{background:var(--bg2)}
.ctop{display:flex;align-items:center;gap:8px;font:500 9.5px var(--mono);text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.ctop .d{width:6px;height:6px;border-radius:50%;background:var(--c)}
.ctop .era{margin-left:auto;color:var(--dim)}
.card h3{margin:10px 0 2px;font:400 21px/1.2 var(--serif);letter-spacing:-.01em}
.life{font-size:12px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.kpi{min-width:0}
.kpi label,.bt label{display:block;font:500 9px var(--mono);text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin-bottom:3px}
.kpi b{font-size:12.5px;font-weight:500;display:block;line-height:1.35}
.kpi b.mono{font-family:var(--mono);color:var(--accent)}
.bt{margin:0;font-size:13px;color:var(--text2)}
.badges{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:12px}
.badge{font:500 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.badge::before{content:"› ";color:var(--accent)}
mark{background:var(--accent-soft);color:inherit;border-radius:1px;padding:0 1px}
.foot{max-width:1120px;margin:28px auto 0;font-size:11.5px;color:var(--dim)}
.subh.sech{margin-top:36px}
.subh.sech:first-of-type{margin-top:8px}
.subh.sech button{background:none;border:0;padding:0;font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--text)}
.subh.sech button:hover{color:var(--accent)}
.subh .n{color:var(--dim)}
.fnote{max-width:1120px;margin:-6px auto 22px;font:500 10.5px/1.7 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fnote button,.clearf{background:none;border:0;border-bottom:1px solid var(--accent);padding:0;color:var(--accent);font:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer}
.clearf{font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;align-self:center}
.who li.out{padding:8px 0 2px;font-size:11.5px;line-height:1.7;color:var(--dim)}
.who li.out button{display:inline;width:auto;border:0;padding:0;background:none;color:var(--muted);font:inherit}
.who li.out button:hover{color:var(--accent)}
.empty-sec{max-width:1120px;margin:0 auto;font:italic 400 14.5px var(--serif);color:var(--dim)}
.indh{margin:30px 0 0;font:400 21px/1.2 var(--serif);letter-spacing:-.01em}
.indh button{background:none;border:0;padding:0;font:inherit;color:var(--text)}
.indh button:hover{color:var(--accent)}
.indh+.sec{margin-top:12px}

/* ============ OVERLAPS ============ */
.lede{max-width:1120px;margin:0 auto 26px;color:var(--text2);font:400 16.5px/1.6 var(--serif)}
.hubs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));max-width:1120px;margin:0 auto;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.hub{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px;min-width:0}
.hub .hh{display:flex;align-items:flex-start;gap:10px}
.hub .hh button{background:none;border:0;padding:0;text-align:left;font:400 19px/1.2 var(--serif);color:var(--text)}
.hub .hh button:hover{color:var(--accent)}
.hub .kind{display:block;font:500 9px/1.6 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin-top:4px}
.hub .cnt{margin-left:auto;flex:none;font:500 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:2px;padding:1px 6px}
.who{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.who button{display:flex;align-items:baseline;gap:9px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:7px 0;min-width:0}
.who button:hover .nm{color:var(--accent)}
.who .d{width:6px;height:6px;border-radius:50%;flex:none;align-self:center}
.who .nm{font:400 14.5px var(--serif);flex:none}
.who .via{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.subh{max-width:1120px;margin:44px auto 14px;font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;gap:12px;align-items:center}
.subh::after{content:"";flex:1;height:1px;background:var(--line)}
.ties{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.tie{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;border-bottom:1px solid var(--line);padding:11px 0;font-size:13px}
.tie button{background:none;border:0;padding:0;font:400 14.5px var(--serif);color:var(--text)}
.tie button:hover{color:var(--accent)}
.tie .rel{color:var(--muted);font-size:12px}

/* ============ DRAWER ============ */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
aside#drawer{position:fixed;top:0;right:0;height:100vh;height:100dvh;width:min(620px,100vw);background:var(--bg);border-left:1px solid var(--line);z-index:21;transform:translateX(102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
aside#drawer.open{transform:none}
.dhead{padding:24px 32px 20px;border-bottom:1px solid var(--line);position:relative}
.dclose{position:absolute;right:22px;top:18px;width:30px;height:30px;border:0;background:none;color:var(--muted);font-size:15px;display:grid;place-items:center}
.dclose:hover{color:var(--text)}
.eyebrow{font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.eyebrow span:first-child{color:var(--c,var(--accent))}
.eyebrow span+span::before{content:"";display:inline-block;width:24px;height:1px;background:var(--line2);vertical-align:middle;margin-right:12px}
.dhead h2{margin:12px 40px 6px 0;font:400 38px/1.08 var(--serif);letter-spacing:-.02em}
.dbody{flex:1;overflow:auto;padding:24px 32px 52px}
.dbadges{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
.dbadge{font:400 13px/1.35 var(--sans);color:var(--text)}
.dbadge label{display:block;font:500 9px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.dbody .kpis{grid-template-columns:repeat(3,1fr);margin:0 0 18px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.note{font-size:12px;color:var(--muted);margin:0 0 16px;padding:1px 0 1px 12px;border-left:1px solid var(--accent)}
blockquote.callout{margin:0 0 14px;padding:0;border:0;font:400 17px/1.55 var(--serif);color:var(--text)}
.sec{margin-top:32px}
.sec h3{display:flex;align-items:center;gap:12px;margin:0 0 12px;font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sec h3::after{content:"";flex:1;height:1px;background:var(--line)}
.sec h3 .num{color:var(--accent);border:0;padding:0;font:inherit}
.sec p{margin:0;color:var(--text2)}
ol.steps,ul.bul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
ol.steps li,ul.bul li{padding:10px 0 10px 18px;border-bottom:1px solid var(--line);color:var(--text2);font-size:13.5px;position:relative}
ol.steps li::before,ul.bul li::before{content:"›";position:absolute;left:3px;top:9px;color:var(--accent);font-family:var(--mono)}
ol.steps li b,ul.bul li b{color:var(--text);font-weight:600}
.basis{float:right;margin:3px 0 4px 10px;font:500 8.5px var(--mono);letter-spacing:.12em;padding:0 5px;border-radius:2px;text-transform:uppercase;cursor:help;border:1px solid currentColor}
.basis.documented{color:var(--doc)}
.basis.pattern{color:var(--pattern)}
.net{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.net button{display:flex;align-items:center;gap:12px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 0}
.net button:hover .nm{color:var(--accent)}
.net .d{width:6px;height:6px;border-radius:50%;flex:none}
.net .nm{font:400 15px var(--serif)}
.net .rel{font-size:12px;color:var(--muted);margin-left:auto;text-align:right}
.net .ar{font:500 9px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.srcs{display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.disc{margin-top:30px;font-size:11px;color:var(--dim);border-top:1px solid var(--line);padding-top:12px}

/* ============ ATLAS ============ */
#atlas{position:absolute;inset:0}
#atlasMap{position:absolute;inset:0;background:var(--bg);z-index:0}
.atlas-bar{left:20px;top:16px;max-width:calc(100% - 40px);z-index:500;display:flex;flex-direction:column;gap:9px;padding:11px 14px}
.atlas-bar .seg button{font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase}
.atlas-bar .chips{gap:3px 13px}
.atlas-status{margin:0;font:500 9.5px/1.6 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.atlas-status .dim{color:var(--dim)}
.atlas-status .live{color:var(--doc)}
.atlas-status .warn{color:var(--c-bhis);cursor:help}
.atlas-status a{color:var(--accent);text-decoration:none}
.atlas-off{left:20px;bottom:24px;z-index:500;max-width:340px;max-height:46vh;overflow:auto;padding:10px 14px}
.atlas-off summary{cursor:pointer;font:500 9.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);list-style:none}
.atlas-off summary::-webkit-details-marker{display:none}
.atlas-off summary::before{content:"› ";color:var(--accent)}
.atlas-off details[open] summary::before{content:"⌄ "}
.atlas-off .n{color:var(--dim)}
.atlas-off ul{list-style:none;margin:10px 0 0;padding:0;border-top:1px solid var(--line)}
.atlas-off li{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.atlas-off li b{font:400 14px var(--serif)}
.atlas-off .d{width:6px;height:6px;border-radius:50%;margin-top:7px;flex:none}
.atlas-off .sub{font-size:11.5px;color:var(--muted)}
.atlas-off .links,.pop-l{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:3px}
.atlas-off .links a{font:500 10px var(--mono);letter-spacing:.04em;text-decoration:none}
/* pins */
.apin{background:none;border:0}
.apin span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;box-sizing:border-box;font:600 9.5px var(--mono);color:var(--bg);transition:transform .15s}
.apin.boi span{background:var(--c);border:2px solid var(--bg);box-shadow:0 0 0 1px var(--c)}
.apin.boi.approx span{background:var(--bg);border:2px dashed var(--c);box-shadow:none}
.apin.fort span{background:var(--c);border:1.5px solid var(--bg);box-shadow:0 0 0 1px var(--c);opacity:.92}
.apin:hover span{transform:scale(1.25)}
/* popups */
.apop .leaflet-popup-content-wrapper{background:var(--bg);color:var(--text);border:1px solid var(--line2);border-radius:2px;box-shadow:0 10px 30px -12px #0005}
.apop .leaflet-popup-tip{background:var(--bg);border:1px solid var(--line2);box-shadow:none}
.apop .leaflet-popup-content{margin:16px 18px 14px;font:13px/1.5 var(--sans);min-width:220px}
.apop a.leaflet-popup-close-button{color:var(--muted);top:6px;right:6px}
.pop-k{display:flex;align-items:center;gap:8px;font:500 9.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.pop-k .d{width:7px;height:7px;border-radius:50%;background:var(--c)}
.pop h4{margin:8px 0 4px;font:400 21px/1.15 var(--serif);letter-spacing:-.01em}
.pop-a{margin:0;color:var(--text2)}
.pop-n{margin:6px 0 0;padding-left:9px;border-left:1px solid var(--accent);font-size:11.5px;color:var(--muted)}
.pop-l{flex-direction:column;gap:0;margin-top:12px;border-top:1px solid var(--line)}
.pop-l a{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--text);font-size:12.5px}
.pop-l a span{font:500 9px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.pop-l a:hover{color:var(--accent)}
.pop .who{max-height:240px;overflow:auto}
.pop .who .nm{font-size:14px}
.leaflet-container{font:13px var(--sans);background:var(--bg)}
.leaflet-control-zoom a{background:var(--bg)!important;color:var(--text)!important;border-color:var(--line)!important;border-radius:2px!important}
.leaflet-bar{border:1px solid var(--line2)!important;box-shadow:none!important;border-radius:2px!important}
.leaflet-control-attribution{background:color-mix(in srgb,var(--bg) 85%,transparent)!important;color:var(--dim)!important;font:9.5px var(--sans)}
.leaflet-control-attribution a{color:var(--muted)!important}
@media (max-width:760px){
  .atlas-bar{left:10px;right:10px;top:10px;max-width:none}
  .atlas-bar .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .atlas-off{left:10px;right:58px;bottom:16px;max-width:none}
}

@media (max-width:760px){
  header.top{padding:12px 16px 0}

  .dhead h2{font-size:29px}

}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

      <div class="overlay atlas-off" id="atlasOff" hidden></div>
    </section>
  </main>
</div>

function normalize(raw){
  const arr = Array.isArray(raw) ? raw : (raw.records || raw.profiles || []);
  const byId = {}, profiles = [], entities = [];
  arr.forEach(r=>{
    if(!r || !r.id){ console.warn('Skipping record without id', r); return; }
    const n = {...r};
    if(n.type === 'entity'){ n._kind='entity'; entities.push(n); }
    else {
      n._kind='profile';
      if(!CATS[n.category]) n.category = TYPE_TO_CAT[n.type] || 'Other';
      if(!TIERS[n.netWorthTier]) console.warn(`${n.id}: unknown netWorthTier "${n.netWorthTier}"`);
      profiles.push(n);
    }
    byId[n.id]=n;
  });
  const links = [], seen = new Set();
  arr.forEach(r=>(r?.connections||[]).forEach(c=>{
    const o = typeof c==='string' ? {id:c} : c;
    if(!byId[o.id]){ console.warn(`${r.id}: connection to unknown id "${o.id}" skipped`); return; }
    const key=[r.id,o.id].sort().join('|');
    if(seen.has(key)) return; seen.add(key);
    links.push({source:r.id, target:o.id, type:EDGE[o.type]?o.type:'connection', label:o.label||''});
  }));
  entities.forEach(e=>{ const g=GICS[e.gics?.sub]; if(!g) return; e._sub=e.gics.sub; e._ind=g[0]; e._sector=g[1]; e._gicsBasis=e.gics.basis; });
  profiles.forEach(p=>{ p._era=p.era||(/[–-]\s*\d{4}\s*$/.test(p.lifespan||'')?'historical':'today'); });   // a closing year in the lifespan = historical; "era" overrides
  profiles.forEach(p=>{   // a person's sector = their primary business (an owned company first)
    const biz=links.filter(l=>l.type!=='parallel'&&(l.source===p.id||l.target===p.id)).map(l=>({l,o:byId[l.source===p.id?l.target:l.source]}))
      .filter(x=>x.o._kind==='entity'&&x.o._sector&&x.o._sector!=='Non-market');
    const pick=biz.find(x=>x.l.type==='ownership')||biz[0];
    if(pick){ p._primary=pick.o.id; p._sector=pick.o._sector; p._sub=pick.o._sub; } else p._sector='Non-market';
  });
  Object.keys(SECTORS).forEach(sec=>{ byId['sector:'+sec]={id:'sector:'+sec, _kind:'tax', level:'sector', sector:sec, name:sectorName(sec)}; });
  entities.forEach(e=>{ if(!e._sector) return;
    if(e._sector!=='Non-market' && e._ind!==e._sub)
      byId['ind:'+e._ind] ||= {id:'ind:'+e._ind, _kind:'tax', level:'industry', sector:e._sector, industry:e._ind, name:e._ind};
    byId['sub:'+e._sub] ||= {id:'sub:'+e._sub, _kind:'tax', level:'sub', sector:e._sector, industry:e._ind, sub:e._sub, name:subLabel(e._sub)};
  });
  const nbNames = id => links.filter(l=>l.source===id||l.target===id).map(l=>byId[l.source===id?l.target:l.source].name);
  profiles.forEach(p=>{ p._hay=[p.name,...(p.aliases||[]),p.category,p.industry,p.netWorthTier,p.originBadge,p.engineBadge,p.capitalBadge,
    p.humbleBeginnings,p.breakthrough,p.shieldingStrategy,p.base,
    ...(p.breakthroughDetail||[]).map(x=>x.t+' '+x.d),...(p.shieldingDetail||[]).map(x=>x.t+' '+x.d),
    ...nbNames(p.id), p._sector, SECTORS[p._sector]?.etf, p._sub].join(' ').toLowerCase(); });
  entities.forEach(e=>{ e._hay=[e.name,e.kind,e.description,e._sector,SECTORS[e._sector]?.etf,e._sub,e._ind].join(' ').toLowerCase(); });
  return {profiles, entities, links, byId};
}
/* Overlaps: two people overlap when they reach the same entity through real (non-"parallel")
   links within OVL_HOPS steps. Paths may pass through ordinary companies but never THROUGH a university or
   foundation, or a very large hub; those can only be the meeting point itself. */
const OVL_HOPS = 2, OVL_THROUGH_MAX = 15;
function computeOverlaps(D){
  const adj=new Map(), add=(a,b,l)=>{ if(!adj.has(a)) adj.set(a,[]); adj.get(a).push({id:b,l}); };
  D.links.forEach(l=>{ if(l.type==='parallel') return; add(l.source,l.target,l); add(l.target,l.source,l); });
  const hubs=new Map();                                  // entityId -> Map(profileId -> path)
  D.profiles.forEach(p=>{
    const seen=new Set([p.id]), q=[[p.id]];
    while(q.length){
      const path=q.shift(); if(path.length>OVL_HOPS) continue;
      const cur=path[path.length-1];
      if(path.length>1 && (D.byId[cur]._sub==='Non-market' || (adj.get(cur)||[]).length>OVL_THROUGH_MAX)) continue;
      (adj.get(path[path.length-1])||[]).forEach(({id})=>{
        if(seen.has(id)||D.byId[id]._kind!=='entity') return;
        seen.add(id); const np=[...path,id]; q.push(np);
        if(!hubs.has(id)) hubs.set(id,new Map()); hubs.get(id).set(p.id,np);
      });
    }
  });
  const pairs=new Map(), key=(a,b)=>[a,b].sort().join('|');
  const deg=id=>adj.get(id)?.length||0;
  // A pair's hub is the company where their two paths meet; ties between equal-length paths go to the bigger hub.
  const offer=(a,b,path,hub=null)=>{
    const k=key(a,b), cur=pairs.get(k);
    if(!cur||path.length<cur.path.length||(path.length===cur.path.length&&hub&&cur.hub&&deg(hub)>deg(cur.hub))) pairs.set(k,{a,b,path,hub}); };
  D.links.forEach(l=>{ if(l.type!=='parallel' && D.byId[l.source]._kind==='profile' && D.byId[l.target]._kind==='profile') offer(l.source,l.target,[l.source,l.target]); });
  hubs.forEach((m,hubId)=>{
    const ents=[...m.entries()];
    for(let i=0;i<ents.length;i++) for(let j=i+1;j<ents.length;j++){
      const [a,pa]=ents[i], [b,pb]=ents[j];
      if(pa.some((x,k)=>k>0&&pb.includes(x)&&x!==pa[pa.length-1])) continue;   // a nearer shared node exists
      offer(a,b,[...pa,...pb.slice(0,-1).reverse()],hubId);
    }
  });
  const meet=new Map();                                  // entityId -> Map(profileId -> path), meeting points only
  pairs.forEach(({a,b,path,hub})=>{ if(!hub) return; if(!meet.has(hub)) meet.set(hub,new Map());
    const i=path.indexOf(hub), m=meet.get(hub), set=(p,pp)=>{ if(!m.has(p)||pp.length<m.get(p).length) m.set(p,pp); };
    set(a,path.slice(0,i+1)); set(b,path.slice(i).reverse()); });
  // a company also lists everyone tied to it directly, so it never looks like its own founder or CEO is missing
  D.entities.forEach(e=>{
    const direct=(adj.get(e.id)||[]).map(x=>x.id).filter(id=>D.byId[id]._kind==='profile');
    if(new Set(direct).size<2 && !meet.has(e.id)) return;
    if(!meet.has(e.id)) meet.set(e.id,new Map());
    direct.forEach(p=>meet.get(e.id).set(p,[p,e.id]));
  });
  const byProfile=new Map(D.profiles.map(p=>[p.id,[]]));
  pairs.forEach(pr=>{ byProfile.get(pr.a).push({other:pr.b,path:pr.path}); byProfile.get(pr.b).push({other:pr.a,path:[...pr.path].reverse()}); });
  byProfile.forEach(l=>l.sort((x,y)=>x.path.length-y.path.length));
  D.entities.forEach(e=>{ e._shared=meet.get(e.id)?.size||0; });
  return {hubs:meet, pairs, byProfile};
}
/* Map regions: each person joins the largest shared hub (3+ people) they belong to, so every
   industry's hub-and-spoke cluster gets its own region. Entities follow their nearest person. */
function computeCommunities(D){
  const H=D.ovl.hubs, hubs=[...H.entries()].filter(([,m])=>m.size>=3).sort((a,b)=>b[1].size-a[1].size).map(([id])=>id);
  const comm=new Map();
  D.profiles.forEach(p=>{ const h=hubs.find(h=>H.get(h).has(p.id)); if(h) comm.set(p.id,h); });
  // a lone member of a region moves next to a person they are directly tied to
  const members=c=>D.profiles.filter(p=>comm.get(p.id)===c).length;
  D.profiles.forEach(p=>{
    if(comm.has(p.id)&&members(comm.get(p.id))>1) return;
    const tie=(D.ovl.byProfile.get(p.id)||[]).find(o=>o.path.length===2&&comm.has(o.other)&&comm.get(o.other)!==comm.get(p.id));
    if(tie) comm.set(p.id,comm.get(tie.other));
  });
  // every hub sits in the region most of its people chose
  H.forEach((m,h)=>{ const c=new Map(); m.forEach((_,p)=>{ if(comm.has(p)) c.set(comm.get(p),(c.get(comm.get(p))||0)+1); });
    if(c.size) comm.set(h,[...c.entries()].sort((x,y)=>y[1]-x[1])[0][0]); });
  const nb=new Map(), add=(a,b)=>{ if(!nb.has(a)) nb.set(a,[]); nb.get(a).push(b); };
  D.links.forEach(l=>{ if(l.type!=='parallel'){ add(l.source,l.target); add(l.target,l.source); } });
  let frontier=[...comm.keys()];
  while(frontier.length){
    const next=[];
    frontier.forEach(id=>(nb.get(id)||[]).forEach(o=>{ if(!comm.has(o)){ comm.set(o,comm.get(id)); next.push(o); } }));
    frontier=next;
  }
  const regions=[...new Set(D.profiles.map(p=>comm.get(p.id)).filter(Boolean))], idx=new Map(regions.map((c,i)=>[c,i]));
  Object.values(D.byId).forEach(n=>{ n._comm=idx.has(comm.get(n.id))?idx.get(comm.get(n.id)):-1; });
  return regions.length;
}
const sectorCenter = (s,w,h) => { const L=G.sectors||[], i=L.indexOf(s), n=L.length||1;
  if(i<0) return [w/2,h/2]; const a=-Math.PI/2+2*Math.PI*i/n; return [w/2+Math.cos(a)*w*.42, h/2+Math.sin(a)*h*.4]; };
const commCenter = (i,w,h) => { const n=DATA.nComm||1, a=-Math.PI/2+2*Math.PI*i/n, R=Math.min(w,h)*.36;
  return i<0 ? [w/2,h/2] : [w/2+Math.cos(a)*R*1.15, h/2+Math.sin(a)*R*.9]; };
const linkBetween = (a,b) => DATA.links.find(l=>(l.source===a&&l.target===b)||(l.source===b&&l.target===a));
const viaText = path => path.length<=2 ? 'direct: '+(linkBetween(path[0],path[1])?.label||'linked')
  : 'via '+path.slice(1,-1).map(id=>DATA.byId[id].name).join(' → ');
const catColor = n => CATS[n.category]?.color || 'var(--muted)';
const colorOf = n => n._kind==='profile' ? catColor(n) : ENTITY_COLOR;
const passCat = p => state.cat==='all' || p.category===state.cat;
const passTier = p => state.tier==='all' || p.netWorthTier===state.tier;
const terms = () => state.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
const matchQ = n => { const t=terms(); return !t.length || t.every(w=>n._hay.includes(w)); };
const passSector = p => state.sector==='all' || p._sector===state.sector;
const passEra = p => state.era==='all' || p._era===state.era;
const narrowedNow = () => state.cat!=='all'||state.tier!=='all'||state.sector!=='all'||state.era!=='all'||terms().length>0;
function filterNote(){
  if(!narrowedNow()) return '';
  const bits=[state.era!=='all'?'Era '+state.era:'', state.cat!=='all'?state.cat:'', state.tier!=='all'?state.tier:'',
    state.sector!=='all'?'Sector '+(SECTORS[state.sector]?.etf||state.sector):'', terms().length?'search “'+state.q.trim()+'”':''].filter(Boolean);
  return `<p class="fnote">Filtered to ${esc(bits.join(' · '))}: showing ${visibleProfiles().length} of ${DATA.profiles.length} people. <button data-clear>Clear filters</button></p>`;
}
function clearFilters(){
  state.cat='all'; state.tier='all'; state.sector='all'; state.era='all'; state.q=''; document.getElementById('q').value=''; refresh();
}
document.addEventListener('click',e=>{ if(e.target.closest('[data-clear]')) clearFilters(); });
const visibleProfiles = () => DATA.profiles.filter(p=>passCat(p)&&passTier(p)&&passSector(p)&&passEra(p)&&matchQ(p));
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hl(text){
  const t=terms(); let out=esc(text); if(!t.length) return out;
  t.forEach(w=>{ const re=new RegExp('('+esc(w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'); out=out.replace(re,'<mark>$1</mark>'); });
  return out;
}
function neighbors(id){
  return DATA.links.filter(l=>l.source===id||l.target===id).map(l=>{
    const out=l.source===id; return {link:l, other:DATA.byId[out?l.target:l.source], out};
  });
}
const tierLabel = p => (p.netWorthTier||'—') + (p.tierBasis==='estimated'?' est.':'');

/* Visible subgraph: filtered profiles + entities reachable through entities (≤2 hops) */
function subgraph(){
  const profs = visibleProfiles();
  if(state.overlap){
    const ok=new Set(profs.map(p=>p.id)), vis=new Map(), edges=new Set();
    DATA.ovl.pairs.forEach(({a,b,path})=>{
      if(!ok.has(a)||!ok.has(b)) return;
      const home=DATA.byId[a];
      path.forEach(id=>{ if(!vis.has(id)){ const n=DATA.byId[id]; vis.set(id,n._kind==='profile'?{cat:n.category,tier:n.netWorthTier}:{cat:home.category,tier:home.netWorthTier}); } });
      path.slice(1).forEach((id,i)=>edges.add([path[i],id].sort().join('|')));
    });
    return {vis, links: DATA.links.filter(l=>edges.has([l.source,l.target].sort().join('|')))};
  }
  const vis = new Map(profs.map(p=>[p.id,{cat:p.category,tier:p.netWorthTier}]));
  let frontier = profs.map(p=>p.id);
  for(let hop=0; hop<2; hop++){
    const next=[];
    frontier.forEach(id=>{
      const home=vis.get(id);
      DATA.links.forEach(l=>{
        if(l.type==='parallel') return;
        const other = l.source===id ? l.target : l.target===id ? l.source : null;
        if(!other || vis.has(other) || DATA.byId[other]._kind!=='entity') return;
        vis.set(other,home); next.push(other);
      });
    });
    frontier=next;
  }
  return {vis, links: DATA.links.filter(l=>vis.has(l.source)&&vis.has(l.target))};
}

/* =====================================================================
   MIND MAP (D3 force graph)
   ===================================================================== */
const G = {svg:null, root:null, zoom:null, sim:null, nodes:[], links:[], pos:new Map(), w:0, h:0, fitT:null};
const isHub = n => n._kind==='entity' && n._shared>=2;
const rFor = n => n._kind==='entity' ? (isHub(n) ? 8+Math.min(10,2*(n._shared-2)) : 7) : (TIERS[n.netWorthTier]?.r || 15);

function renderLegend(){
  const cats = Object.entries(CATS).map(([k,c])=>`<div class="it"><span class="sw" style="background:${c.color}"></span>${esc(c.short)}</div>`).join('');
  const sizes = Object.entries(TIERS).map(([k,t])=>`<span class="sz"><i style="width:${t.r}px;height:${t.r}px"></i>${esc(k)}</span>`).join('');
  document.getElementById('legend').innerHTML = `<h4>Region</h4>${cats}
    <div class="it"><span class="sq"></span>Business / institution</div>
    <div class="it"><span class="hb"></span>Shared by 2+ people</div>
    <div class="extra"><h4>Size tier</h4><div class="sizes">${sizes}</div><h4>Connection</h4>
    <div class="it"><span class="ln"></span>Ownership · supply · money · deal</div>
    <div class="it"><span class="ln" style="border-top-style:dashed"></span>Board · mentor · civic · origin</div>
    <div class="it"><span class="ln" style="border-top-style:dotted"></span>Family · thematic parallel</div></div>`;
}

function renderMap(){
  const host=document.getElementById('map');
  host.querySelector('svg')?.remove();
  if(G.sim) G.sim.stop();
  const {vis,links}=subgraph();
  document.getElementById('mapEmpty').hidden = vis.size>0;
  const w=host.clientWidth, h=host.clientHeight; G.w=w; G.h=h;

  G.nodes=[...vis.entries()].map(([id,home])=>{
    const src=DATA.byId[id], p=G.pos.get(id);
    const [cx,cy]=commCenter(src._comm,w,h);
    return {...src, home, r:rFor(src), x:p?.x ?? cx+(Math.random()-.5)*120, y:p?.y ?? cy+(Math.random()-.5)*120};
  });
  G.links=links.map(l=>({...l}));
  if(state.layout==='sector'){   // sector ETF → industry → sub-industry → company; people attach through their real links
    const add=new Map(), seen=new Set(), tie=(x,y)=>{ const k=x+'>'+y; if(!seen.has(k)){ seen.add(k); G.links.push({source:x,target:y,type:'tax',label:''}); } };
    G.sectors=SECTOR_RING.filter(sec=>sec!=='Non-market'||G.nodes.some(n=>n._sector==='Non-market'));
    G.sectors.forEach(sec=>add.set('sector:'+sec,DATA.byId['sector:'+sec]));
    G.nodes.forEach(n=>{ if(n._kind!=='entity'||!n._sector) return;
      const sid='sector:'+n._sector, iid=DATA.byId['ind:'+n._ind]&&n._sector!=='Non-market'&&n._ind!==n._sub?'ind:'+n._ind:null, bid='sub:'+n._sub;
      add.set(bid,DATA.byId[bid]);
      if(iid){ add.set(iid,DATA.byId[iid]); tie(sid,iid); tie(iid,bid); } else tie(sid,bid);
      tie(bid,n.id);
    });
    add.forEach(t=>{ const [x,y]=sectorCenter(t.sector,w,h); G.nodes.push({...t, r:t.level==='sector'?26:t.level==='industry'?4:3, x:x+(Math.random()-.5)*40, y:y+(Math.random()-.5)*40}); });
  }


  const svg=d3.select(host).insert('svg',':first-child').attr('viewBox',[0,0,w,h]).attr('role','img').attr('aria-label','Network mind map');
  G.svg=svg;
  svg.append('defs').append('marker').attr('id','ar').attr('viewBox','0 -5 10 10').attr('refX',8).attr('refY',0)
    .attr('markerWidth',6).attr('markerHeight',6).attr('orient','auto')
    .append('path').attr('class','arrow').attr('d','M0,-3.5L8,0L0,3.5');

  const root=svg.append('g'); G.root=root;
  G.userZoomed=false;
  G.zoom=d3.zoom().scaleExtent([.15,4]).on('zoom',ev=>{ if(ev.sourceEvent) G.userZoomed=true; root.attr('transform',ev.transform); svg.classed('zoomed',ev.transform.k>1.25); });
  svg.call(G.zoom).on('dblclick.zoom',null);
  svg.on('click',ev=>{ if(ev.target===svg.node()) clearHot(); });

  // node geometry: people are circles (r); companies and sector hubs are boxes (hw × hh), like a flow diagram
  const crowded=G.nodes.length>60, CH=5.9;
  G.nodes.forEach(d=>{
    if(d._kind==='entity'){
      if(isHub(d)){ d.label=d.name.toUpperCase(); if(d.label.length>28) d.label=d.label.slice(0,27)+'…'; d.hw=d.label.length*CH/2+9; d.hh=9; }
      else { d.label=d.name.toUpperCase(); d.hw=d.hh=3.5; }
    } else if(d.level==='sector'){ d.label=SECTORS[d.sector].etf||'NON-MKT'; d.hw=d.label.length*7.6/2+12; d.hh=11; }
    else if(d.level==='sub'){ d.r=3; } else if(d.level==='industry'){ d.r=4; }
    if(d.hw) d.r=Math.max(d.hw,d.hh);
  });
  const reach=(n,ux,uy)=>n.hw ? Math.min(n.hw/Math.max(Math.abs(ux),1e-6), n.hh/Math.max(Math.abs(uy),1e-6)) : n.r;

  const link=root.append('g').selectAll('path').data(G.links).join('path')
    .attr('class',d=>`link t-${d.type} ${DASHED.includes(d.type)?'dashed':''} ${DOTTED.includes(d.type)?'dotted':''}`)
    .attr('marker-end',d=>d.type==='parallel'||d.type==='tax'?null:'url(#ar)');
  link.append('title').text(d=>`${DATA.byId[d.source].name} → ${DATA.byId[d.target].name}: ${d.label||EDGE[d.type].label}`);
  const elabel=root.append('g').selectAll('text').data(G.links).join('text').attr('class','elabel').attr('text-anchor','middle').text(d=>d.label||'');

  const node=root.append('g').selectAll('g').data(G.nodes,d=>d.id).join('g')
    .attr('class',d=>`node ${d._kind}${isHub(d)?' hub':''}${d._kind==='tax'?' tax-'+d.level:''}${d.tierBasis==='estimated'?' est':''}`)
    .style('--c',d=>d._kind==='profile'?catColor(d):null)
    .attr('tabindex',0).attr('role','button').attr('aria-label',d=>d.name)
    .on('click',(ev,d)=>{ ev.stopPropagation(); openNode(d.id); })
    .on('keydown',(ev,d)=>{ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); openNode(d.id);} })
    .on('mouseenter',(ev,d)=>hot(d.id)).on('mouseleave',()=>{ state.openId ? hot(state.openId) : clearHot(); })
    .call(d3.drag()
      .on('start',(ev,d)=>{ if(!ev.active) G.sim.alphaTarget(.2).restart(); d.fx=d.x; d.fy=d.y; })
      .on('drag',(ev,d)=>{ d.fx=ev.x; d.fy=ev.y; })
      .on('end',(ev,d)=>{ if(!ev.active) G.sim.alphaTarget(0); d.fx=null; d.fy=null; }));

  const prof=node.filter(d=>d._kind==='profile');
  prof.append('circle').attr('class','ring').attr('r',d=>d.r);
  prof.append('circle').attr('class','core').attr('r',d=>Math.max(2.5,d.r*.3));
  prof.append('text').attr('text-anchor','middle').attr('dy',d=>d.r+15).text(d=>d.name);
  const boxed=node.filter(d=>d.hw);
  boxed.append('rect').attr('class','box').attr('x',d=>-d.hw).attr('y',d=>-d.hh).attr('width',d=>d.hw*2).attr('height',d=>d.hh*2);
  boxed.filter(d=>isHub(d)||d.level==='sector').append('text').attr('text-anchor','middle').attr('dy','.36em').text(d=>d.label);
  node.filter(d=>d._kind==='entity'&&!isHub(d)).append('text').attr('text-anchor','middle').attr('dy',d=>d.hh+11)
    .attr('class',crowded?'minor':null).text(d=>d.label);
  node.filter(d=>d.level==='sector').append('text').attr('class','tax-sub').attr('text-anchor','middle').attr('dy',d=>d.hh+16).text(d=>d.sector);
  const ind=node.filter(d=>d.level==='industry');
  ind.append('circle').attr('class','idot').attr('r',4);
  ind.append('text').attr('text-anchor','middle').attr('dy',16).text(d=>d.name);
  const sub=node.filter(d=>d.level==='sub');
  sub.append('circle').attr('class','dot').attr('r',3);
  sub.append('text').attr('text-anchor','middle').attr('dy',15).attr('class',crowded?'minor':null).text(d=>d.name);
  node.filter(isHub).append('title').text(d=>`${d.name}: shared by ${d._shared} people`);

  G.sim=d3.forceSimulation(G.nodes)
    .force('link',d3.forceLink(G.links).id(d=>d.id)
      .distance(l=>l.type==='tax'?(l.source.level==='sector'?62:l.source.level==='industry'?38:32):l.type==='parallel'?220:(l.source._kind==='profile'||l.target._kind==='profile')?95:70)
      .strength(l=>l.type==='tax'?.8:state.layout==='sector'?(l.type==='parallel'?0:.03):l.type==='parallel'?.05:SOFT.includes(l.type)?.25:.7))
    .force('charge',d3.forceManyBody().strength(d=>d._kind==='profile'?-340:d.level==='sector'?-500:d.level==='industry'?-160:isHub(d)?-240:-110).distanceMax(600))
    .force('collide',d3.forceCollide(d=>d._kind==='profile'?d.r+26:d.hw?d.hw*.7+10:12))
    .on('tick',()=>{
      link.attr('d',d=>{
        const dx=d.target.x-d.source.x, dy=d.target.y-d.source.y, L=Math.hypot(dx,dy)||1, ux=dx/L, uy=dy/L;
        const s0=reach(d.source,ux,uy), t0=reach(d.target,ux,uy)+(d.type==='parallel'||d.type==='tax'?0:3);
        return `M${d.source.x+ux*s0},${d.source.y+uy*s0}L${d.target.x-ux*t0},${d.target.y-uy*t0}`;
      });
      elabel.attr('x',d=>(d.source.x+d.target.x)/2).attr('y',d=>(d.source.y+d.target.y)/2-4);
      node.attr('transform',d=>`translate(${d.x},${d.y})`);
    })
    .on('end',()=>{ G.nodes.forEach(n=>G.pos.set(n.id,{x:n.x,y:n.y})); if(!G.userZoomed) fit(600); });

  applyLayout(false);
  if(state.openId) hot(state.openId);
}

function applyLayout(reheat){
  if(!G.sim) return;
  const {w,h}=G, sim=G.sim;
  const quad={'Washington, DC':[.27,.62],'Baltimore':[.73,.38],'National':[.5,.15],'Other':[.5,.85]};
  const tierX={'$500K-$5M':.1,'$5M-$100M':.3,'$100M-$500M':.5,'$500M-$1B':.7,'$1B+':.9};
  sim.force('center', state.layout==='force' ? d3.forceCenter(w/2,h/2) : null);
  if(state.layout!=='sector') G.sectors=null;
  if(state.layout==='cluster'){
    sim.force('x',d3.forceX(d=>w*(quad[d.home?.cat]||[.5,.5])[0]).strength(d=>d._kind==='profile'?.18:.08));
    sim.force('y',d3.forceY(d=>h*(quad[d.home?.cat]||[.5,.5])[1]).strength(d=>d._kind==='profile'?.18:.08));
  } else if(state.layout==='sector'){
    const c=d=>sectorCenter(d._kind==='tax'?d.sector:d._sector,w,h);
    sim.force('x',d3.forceX(d=>c(d)[0]).strength(d=>d.level==='sector'?.6:d._kind==='profile'?.12:.14));
    sim.force('y',d3.forceY(d=>c(d)[1]).strength(d=>d.level==='sector'?.6:d._kind==='profile'?.12:.14));
  } else if(state.layout==='tier'){
    sim.force('x',d3.forceX(d=>w*(tierX[d.home?.tier]||.5)).strength(d=>d._kind==='profile'?.3:.1));
    sim.force('y',d3.forceY(h/2).strength(.05));
  } else {
    sim.force('x',d3.forceX(d=>commCenter(d._comm,w,h)[0]).strength(d=>d._comm<0?.02:.06));
    sim.force('y',d3.forceY(d=>commCenter(d._comm,w,h)[1]).strength(d=>d._comm<0?.02:.06));
  }
  sim.alpha(reheat?.9:1).restart();
  clearTimeout(G.fitT); G.fitT=setTimeout(()=>fit(500),900);
}

function fit(dur){
  if(!G.nodes.length||!G.svg) return;
  // fit the main body of the map; a few far-flung nodes shouldn't shrink everything else to illegible
  const pad=60, q=G.nodes.length>40?.04:0, qs=a=>{ a=[...a].sort((x,y)=>x-y); return [a[Math.floor(q*(a.length-1))], a[Math.ceil((1-q)*(a.length-1))]]; };
  const [xa,xb]=qs(G.nodes.map(n=>n.x)), [ya,yb]=qs(G.nodes.map(n=>n.y));
  const x0=xa-pad, x1=xb+pad, y0=ya-pad, y1=yb+pad+20;
  const L = G.w>760 ? (document.getElementById('legend').offsetWidth+24) : 0;   // keep clear of the legend panel
  const aw=G.w-L, k=Math.max(.3,Math.min(1.6, Math.min(aw/(x1-x0), G.h/(y1-y0))));
  G.svg.transition().duration(dur).call(G.zoom.transform, d3.zoomIdentity.translate(L+aw/2-k*(x0+x1)/2, G.h/2-k*(y0+y1)/2).scale(k));
}
function hot(id){
  if(!G.root) return;
  const nb=new Set([id]); G.links.forEach(l=>{ if(l.source.id===id) nb.add(l.target.id); if(l.target.id===id) nb.add(l.source.id); });
  const on=d=>d.source.id===id||d.target.id===id;
  G.root.selectAll('.node').classed('faded',d=>!nb.has(d.id)).classed('nb',d=>nb.has(d.id)).classed('sel',d=>d.id===state.openId);
  G.root.selectAll('.link').classed('faded',d=>!on(d)).classed('hot',on);
  G.root.selectAll('.elabel').classed('faded',d=>!on(d)).style('opacity',d=>on(d)?.95:null);
}
function clearHot(){
  if(!G.root) return;
  G.root.selectAll('.node').classed('faded',false).classed('nb',false).classed('sel',d=>d.id===state.openId);
  G.root.selectAll('.link').classed('faded',false).classed('hot',false);
  G.root.selectAll('.elabel').classed('faded',false).style('opacity',null);
}

/* Real business links between companies in different GICS sectors: where one sector's hub runs on another's spokes. */
function crossHTML(){
  const groups=new Map();
  DATA.links.forEach(l=>{
    if(l.type==='parallel') return;
    const a=DATA.byId[l.source], b=DATA.byId[l.target];
    if(a._kind!=='entity'||b._kind!=='entity'||!a._sector||!b._sector||a._sector===b._sector||a._sector==='Non-market'||b._sector==='Non-market') return;
    if(state.sector!=='all'&&a._sector!==state.sector&&b._sector!==state.sector) return;
    const k=[a._sector,b._sector].sort().join('|'); if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(l);
  });
  if(!groups.size) return '';
  const rows=[...groups.entries()].sort((x,y)=>y[1].length-x[1].length).map(([k,ls])=>{
    const [s1,s2]=k.split('|');
    return `<div class="tie" style="flex-direction:column;align-items:stretch">
      <div style="display:flex;gap:8px;align-items:baseline;flex-wrap:wrap"><button data-open="sector:${esc(s1)}">${esc(sectorName(s1))}</button><span class="rel">↔</span><button data-open="sector:${esc(s2)}">${esc(sectorName(s2))}</button><span class="rel" style="margin-left:auto">${ls.length} link${ls.length===1?'':'s'}</span></div>
      <div style="display:flex;flex-direction:column;gap:3px;margin-top:6px">${ls.map(l=>`<span class="rel"><button data-open="${esc(l.source)}" style="font-weight:500">${esc(DATA.byId[l.source].name)}</button> → <button data-open="${esc(l.target)}" style="font-weight:500">${esc(DATA.byId[l.target].name)}</button> · ${esc(l.label||EDGE[l.type].label)}</span>`).join('')}</div></div>`;
  }).join('');
  return `<h3 class="subh">Cross-sector links</h3><p class="lede" style="margin-bottom:12px">Real business links between companies in different sectors, where a business in one part of the economy runs on partners from another.</p><div class="ties">${rows}</div>`;
}

  [/\bart|culture|galler/i,      'Arts & Culture', '#4A6FA5']
];
const BOI_FALLBACK_COLORS = ['#5E7D6B','#8A5A2B','#4A6FA5','#A0522D'];
const boiClean = s => String(s ?? '').replace(/\s+/g, ' ').trim();
function boiCategory(h){
  h = boiClean(h);
  for (const [re, name] of BOI_CATS) if (re.test(h)) return name;
  return h.replace(/\b\w/g, m => m.toUpperCase());
}
function boiColor(cat){
  const hit = BOI_CATS.find(c => c[1] === cat);
  if (hit) return hit[2];
  let h = 0; for (const ch of cat) h = (h*31 + ch.charCodeAt(0)) >>> 0;
  return BOI_FALLBACK_COLORS[h % BOI_FALLBACK_COLORS.length];
}
const NO_PLACE = /^(mobile|online|delivery|delivery\s*\/\s*shipping|shipping|food truck|app|n\/?a|tbd|virtual)$/i;
const REGION_ONLY = /^(maryland|md|dmv|virginia|va|dc|d\.c\.|washington|online|nationwide)$/i;
const STREETY = /\d|\b(st|street|ave|avenue|rd|road|blvd|boulevard|dr|drive|pike|way|place|pl|ln|lane|ct|court|terrace|hwy|highway|pkwy|parkway|sq|square|market)\b/i;

function boiCity(raw){
  // keep "Forest Heights,\n MD" together; drop a 2nd line like "Washington, DC\nMaryland"
  let s = String(raw ?? '').replace(/,\s*\n\s*/g, ', ').split('\n')[0];
  s = boiClean(s).replace(/,$/, '');
  s = s.replace(/^washington,?\s*d\.?\s*c\.?$/i, 'Washington, DC').replace(/,\s*d\.?\s*c\.?$/i, ', DC');
  if (!s || REGION_ONLY.test(s)) return '';
  if (!/,\s*[A-Za-z]{2}$/.test(s) && !/,\s*\w+/.test(s)) s += ', MD';      // "Owings Mills" → "Owings Mills, MD"
  return s;
}
function boiStreet(raw){
  // for geocoding only: drop suite/stall/floor detail the geocoders choke on
  return boiClean(raw)
    .replace(/,?\s*\d+(st|nd|rd|th)\s+floor.*$/i, '')
    .replace(/,?\s*\b(suite|ste\.?|unit|stall|floor|fl\.?|apt\.?)\b.*$/i, '')
    .replace(/,?\s*#\s*\w[\w-]*.*$/, '')
    .replace(/,\s*[\d-]+$/, '')
    .replace(/,$/, '').trim();
}
function boiUrl(w){
  w = boiClean(w);
  if (!w || /^ig\s*:/i.test(w) || /^@/.test(w)) return null;
  if (/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(w)) return {href:'mailto:'+w, label:w};
  if (/^[\d\s().+-]{7,}$/.test(w)) return {href:'tel:'+w.replace(/[^\d+]/g,''), label:w};
  w = w.replace(/\.$/, '').replace(/^ww\./i, 'www.');
  if (!/^https?:\/\//i.test(w)) { if (!/\.[a-z]{2,}/i.test(w)) return null; w = 'https://' + w; }
  let label = w; try { label = new URL(w).hostname.replace(/^www\./, ''); } catch (_) { return null; }
  return {href:w, label};
}
function boiHandle(...cells){
  for (const c of cells){
    const s = boiClean(c);
    const m = s.match(/@([A-Za-z0-9._]{2,30})/) || s.match(/^ig\s*:\s*@?([A-Za-z0-9._]{2,30})/i);
    if (m) return m[1].replace(/\.$/, '');
  }
  return '';
}
function boiRecord(c, cat, tab, rowIdx){
  const name = boiClean(c[0]).replace(/\s*\(\s*/g, ' (').replace(/\s+\)/g, ')');
  const addrRaw = boiClean(c[1]), city = boiCity(c[2]);
  const offline = NO_PLACE.test(addrRaw) || (!addrRaw && !city);
  const street = !offline && addrRaw && STREETY.test(addrRaw) ? boiStreet(addrRaw) : '';
  const mode = offline ? 'none' : street ? 'street' : city ? 'city' : 'none';
  const query = mode === 'street' ? `${street}, ${city || 'MD'}` : mode === 'city' ? city : '';
  return {
    id: `${tab}:${rowIdx}`, name, category: cat, tab,
    address: offline ? '' : addrRaw, city, offlineLabel: offline ? (addrRaw || 'No storefront') : '',
    website: boiUrl(c[3]), instagram: boiHandle(c[4], c[3]),
    mode, query, key: query.toLowerCase()
  };
}
/* rows: array of arrays (PapaParse output, header:false). Returns records. */
function parseBOI(rows, tab){
  const out = []; let cat = null;
  rows.forEach((r, i) => {
    const c = (r || []).map(x => x ?? '');
    if (!c.some(x => boiClean(x))) return;
    if (/^address$/i.test(boiClean(c[1]))) { cat = boiCategory(c[0]); return; }
    if (/^column \d+$/i.test(boiClean(c[0]))) return;
    if (!cat || !boiClean(c[0])) return;               // banner/quote rows above the first section
    out.push(boiRecord(c, cat, tab, i));
  });
  return out;
}
/* Profiles: their "base" string → a single geocodable place */
function baseQuery(base){
  let s = boiClean(base).replace(/\barea\b/i, '').replace(/\s+,/g, ',');
  if (/^global\b/i.test(s)) { const m = s.match(/\(([^/)]+)/); s = m ? m[1] : s; }
  s = s.split(/\s*[\/;]\s*/)[0];
  if (/^NY$/i.test(s.trim())) s = 'New York, NY';
  return boiClean(s);
}

/* =====================================================================
   ATLAS (Leaflet) — two layers on one minimalist basemap
     · Fortunes: every profile pinned to its "base", grouped by city.
       Uses the same Era / Archetype / Net worth / Sector / Search filters.
     · Businesses: read live from the Google Sheet on every visit, plus the
       researched listings in places.json → additions.
   Locations come from places.json (pre-geocoded). Anything new in the
   sheet is geocoded in the visitor's browser (OpenStreetMap Nominatim,
   one request per ~1.1s) and remembered in that browser.
   To pin a profile somewhere other than its base, give it "geo":[lat,lng].
   ===================================================================== */
const ATLAS = {
  map:null, tiles:null, theme:null, layer:'boi', group:null,
  places:null, boi:null, boiSource:'', boiErr:'', boiOff:new Set(), geoLive:{}, pending:0,
  libs:null, booting:null, fitted:{fortunes:false, boi:false}
};
const ATLAS_LIBS = {
  css:'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css',
  js:'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js',
  papa:'https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js'
};
const GEO_LS = 'atlas-geo-v1';
function loadScript(src){ return new Promise((ok,no)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=()=>no(new Error('Could not load '+src)); document.head.appendChild(s); }); }
function atlasLibs(){
  if (ATLAS.libs) return ATLAS.libs;
  const l=document.createElement('link'); l.rel='stylesheet'; l.href=ATLAS_LIBS.css; document.head.appendChild(l);
  return ATLAS.libs = Promise.all([window.L?null:loadScript(ATLAS_LIBS.js), window.Papa?null:loadScript(ATLAS_LIBS.papa)]);
}
const atlasTheme = () => document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
function atlasTiles(){
  // Esri gray canvas: keyless, quiet, with a light and a dark variant (CARTO now needs a key off localhost)
  const t=atlasTheme(); if (ATLAS.tiles && ATLAS.theme===t) return;
  ATLAS.theme=t; (ATLAS.tiles||[]).forEach(l=>ATLAS.map.removeLayer(l));
  const v = t==='dark' ? 'Dark' : 'Light', url = k => `https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_${v}_Gray_${k}/MapServer/tile/{z}/{y}/{x}`;
  ATLAS.tiles = [
    L.tileLayer(url('Base'), {maxNativeZoom:16, maxZoom:19, attribution:'Tiles &copy; Esri &mdash; Esri, HERE, Garmin, &copy; OpenStreetMap contributors'}),
    L.tileLayer(url('Reference'), {maxNativeZoom:16, maxZoom:19, pane:'shadowPane', opacity:.85})
  ];
  ATLAS.tiles.forEach(l=>l.addTo(ATLAS.map));
}

/* ---------- data ---------- */
function geoCache(){ try { return JSON.parse(localStorage.getItem(GEO_LS)||'{}'); } catch(_) { return {}; } }
function geoSave(){ try { localStorage.setItem(GEO_LS, JSON.stringify(ATLAS.geoLive)); } catch(_) {} }
function geoFor(r){ return ATLAS.places?.geo?.[r.key] || ATLAS.geoLive[r.key] || null; }
async function loadPlaces(){
  try { const res=await fetch('places.json',{cache:'no-store'}); if (res.ok) return await res.json(); } catch(_) {}
  return {geo:{}, bases:{}, boiSnapshot:[]};
}
async function loadBOI(){
  const parse = txt => Papa.parse(txt,{skipEmptyLines:false}).data;
  try {
    const parts = await Promise.all(BOI.tabs.map(async t=>{
      const res = await fetch(BOI.csvUrl(t.gid),{cache:'no-store'});
      if (!res.ok) throw new Error(`${t.name}: HTTP ${res.status}`);
      return parseBOI(parse(await res.text()), t.name);
    }));
    ATLAS.boi = parts.flat(); ATLAS.boiSource='live'; ATLAS.boiErr='';
  } catch (e) {
    ATLAS.boi = ATLAS.places?.boiSnapshot || []; ATLAS.boiSource='snapshot'; ATLAS.boiErr=String(e.message||e);
  }
  // researched listings (places.json → additions) fill in around the sheet; a sheet row for the same business wins
  const have = new Set(ATLAS.boi.map(r=>boiDupKey(r)));
  const extra = (ATLAS.places?.additions || []).filter(r=>!have.has(boiDupKey(r)));
  ATLAS.nAdded = extra.length;
  ATLAS.boi = ATLAS.boi.concat(extra);
}
// same business = same name at the same street number + street name (branches of a chain stay separate)
const boiAddrKey = r => { const m=String(r.address||'').toLowerCase().match(/(\d+)\s+(?:[nsew]\.?\s+)?([a-z0-9]+)/); return m ? m[1]+m[2] : (r.city||'').split(',')[0].toLowerCase(); };
const boiDupKey = r => (r.name.toLowerCase().replace(/^the\s+/,'').replace(/[^a-z0-9]/g,'')+'|'+boiAddrKey(r));
/* geocode anything the pre-built file doesn't cover, politely, one at a time */
async function geocodeMissing(){
  const todo = (ATLAS.boi||[]).filter(r=>r.mode!=='none' && !geoFor(r));
  const seen = new Set(); ATLAS.pending = todo.length; atlasStatus();
  for (const r of todo){
    if (seen.has(r.key)) { ATLAS.pending--; continue; } seen.add(r.key);
    let hit = await nominatim(r.query);
    if (!hit && r.mode==='street' && r.city) { hit = await nominatim(r.city); if (hit) hit[2]='city'; }
    if (hit) { ATLAS.geoLive[r.key] = [hit[0], hit[1], hit[2] || r.mode]; geoSave(); }
    ATLAS.pending--; if (ATLAS.layer==='boi' && state.view==='atlas') drawAtlas(false);
  }
  atlasStatus();
}
let lastNom = 0;
async function nominatim(q){
  const wait = 1100 - (Date.now()-lastNom); if (wait>0) await new Promise(r=>setTimeout(r,wait)); lastNom=Date.now();
  try {
    const u='https://nominatim.openstreetmap.org/search?'+new URLSearchParams({q, format:'json', limit:'1', countrycodes:'us'});
    const d=await (await fetch(u,{headers:{'Accept-Language':'en'}})).json();
    return d[0] ? [ +(+d[0].lat).toFixed(5), +(+d[0].lon).toFixed(5) ] : null;
  } catch(_) { return null; }
}

/* ---------- UI ---------- */
function boiVisible(){
  const t = terms();
  return (ATLAS.boi||[]).filter(r=>!ATLAS.boiOff.has(r.category) &&
    (!t.length || t.every(w=>[r.name,r.category,r.address,r.city,r.instagram,r.owner,r.note].join(' ').toLowerCase().includes(w))));
}
function renderAtlasBar(){
  document.querySelectorAll('#atlasLayer button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.layer===ATLAS.layer));
  document.querySelector('header.top .row2').hidden = ATLAS.layer==='boi';

  chips.innerHTML = `<button class="chip" data-boi="__all" aria-pressed="${!ATLAS.boiOff.size}">All <span class="n">${ATLAS.boi.length}</span></button>` +
    cats.map(c=>`<button class="chip" data-boi="${esc(c)}" aria-pressed="${!ATLAS.boiOff.has(c)}" style="--c:${boiColor(c)}"><span class="d"></span>${esc(c)} <span class="n">${n(c)}</span></button>`).join('');
}
function atlasStatus(){
  const el=document.getElementById('atlasStatus'); if (!el) return;
  if (ATLAS.layer==='fortunes'){
    const ps = visibleProfiles(); const cities = new Set(ps.map(p=>profileLatLng(p)?.join(',')).filter(Boolean));
    el.innerHTML = `${ps.length} owners · ${cities.size} cities · <span class="dim">pinned to each owner's home base</span>`;
    return;
  }
  if (!ATLAS.boi){ el.textContent='Loading the index…'; return; }
  const vis = boiVisible(), onMap = vis.filter(r=>geoFor(r)).length;
  el.innerHTML = `${vis.length} listings · ${onMap} on map` +
    (ATLAS.pending>0 ? ` · locating ${ATLAS.pending}…` : '') +
    (ATLAS.boiSource==='live' ? ` · <span class="live">live from Google Sheet</span>` : ` · <span class="warn" title="${esc(ATLAS.boiErr)}">sheet unreachable, showing saved copy</span>`) +
    (ATLAS.nAdded ? ` <span class="dim">+ ${ATLAS.nAdded} researched</span>` : '') +
    ` · <a href="${BOI.viewUrl()}" target="_blank" rel="noopener">source ↗</a>`;
}
function renderOffList(){
  const el = document.getElementById('atlasOff');
  if (ATLAS.layer!=='boi' || !ATLAS.boi){ el.hidden=true; return; }
  const off = boiVisible().filter(r=>r.mode==='none' || (!geoFor(r) && ATLAS.pending===0));
  if (!off.length){ el.hidden=true; return; }
  el.hidden=false;
  el.innerHTML = `<details><summary>No storefront to pin <span class="n">${off.length}</span></summary><ul>${off.map(r=>
    `<li><span class="d" style="background:${boiColor(r.category)}"></span><span><b>${esc(r.name)}</b><br><span class="sub">${esc(r.category)} · ${esc(r.offlineLabel || r.city || 'Location not found')}</span>${linksHTML(r)}</span></li>`).join('')}</ul></details>`;
}
const igHref = h => 'https://www.instagram.com/'+encodeURIComponent(h)+'/';
function linksHTML(r){
  const a=[];
  if (r.website) a.push(`<a href="${esc(r.website.href)}" target="_blank" rel="noopener">${esc(r.website.label)} ↗</a>`);
  if (r.instagram) a.push(`<a href="${igHref(r.instagram)}" target="_blank" rel="noopener">@${esc(r.instagram)}</a>`);
  return a.length ? `<span class="links">${a.join('')}</span>` : '';
}
function boiPopup(r, g){
  const addr = [r.address, r.city].filter(Boolean).join(', ');
  const dir = 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent([r.name, addr].join(', '));
  return `<div class="pop" style="--c:${boiColor(r.category)}">
    <div class="pop-k"><span class="d"></span>${esc(r.category)}</div>
    <h4>${esc(r.name)}</h4>
    ${addr?`<p class="pop-a">${esc(addr)}</p>`:''}
    ${r.owner?`<p class="pop-a" style="font-size:12px;color:var(--muted);margin-top:4px">Owner: ${esc(r.owner)}</p>`:''}
    ${r.note?`<p class="pop-n">${esc(r.note)}</p>`:''}
    ${g[2]==='city'?`<p class="pop-n">Pin is approximate. The listing gives a city, not a street address.</p>`:''}
    <div class="pop-l">
      ${r.website?`<a href="${esc(r.website.href)}" target="_blank" rel="noopener"><span>Website</span>${esc(r.website.label)} ↗</a>`:''}
      ${r.instagram?`<a href="${igHref(r.instagram)}" target="_blank" rel="noopener"><span>Instagram</span>@${esc(r.instagram)} ↗</a>`:''}
      <a href="${dir}" target="_blank" rel="noopener"><span>Directions</span>Google Maps ↗</a>
      ${r.source?`<a href="${esc(r.source)}" target="_blank" rel="noopener"><span>Listed by</span>${esc(boiUrl(r.source)?.label||'source')} ↗</a>`:''}
    </div></div>`;
}
function profileLatLng(p){
  if (Array.isArray(p.geo) && p.geo.length>=2) return [+p.geo[0], +p.geo[1]];
  const b = ATLAS.places?.bases?.[p.base]; return b ? [b[0], b[1]] : null;
}
function fortunesPopup(label, ps){
  return `<div class="pop">
    <div class="pop-k">Home base · ${ps.length} ${ps.length===1?'owner':'owners'}</div>
    <h4>${esc(label)}</h4>
    <ul class="who">${ps.slice().sort((a,b)=>(TIERS[b.netWorthTier]?.rank||0)-(TIERS[a.netWorthTier]?.rank||0)).map(p=>
      `<li><button data-go="${esc(p.id)}"><span class="d" style="background:${catColor(p)}"></span><span class="nm">${esc(p.name)}</span><span class="via">${esc(p.industry||p.category)}</span></button></li>`).join('')}</ul></div>`;
}
/* spread markers that share an exact spot (Lexington Market stalls, chains) */
function spread(items){
  const at = new Map();
  items.forEach(it=>{ const k=it.ll.join(','); (at.get(k)||at.set(k,[]).get(k)).push(it); });
  for (const group of at.values()){
    if (group.length<2) continue;
    group.forEach((it,i)=>{ const a=2*Math.PI*i/group.length, r=0.00028; it.ll=[it.ll[0]+r*Math.sin(a), it.ll[1]+r*Math.cos(a)*1.3]; });
  }
  return items;
}
function drawAtlas(fit){
  if (!ATLAS.map) return;
  atlasTiles();
  if (ATLAS.group) ATLAS.map.removeLayer(ATLAS.group);
  const g = ATLAS.group = L.featureGroup().addTo(ATLAS.map);
  if (ATLAS.layer==='fortunes'){
    const byCity = new Map();
    visibleProfiles().forEach(p=>{ const ll=profileLatLng(p); if(!ll) return; const k=ll.join(','); (byCity.get(k)||byCity.set(k,{ll,ps:[],label:p.geo?p.name:baseQuery(p.base)}).get(k)).ps.push(p); });
    for (const {ll,ps,label} of byCity.values()){
      const cats = new Set(ps.map(p=>p.category)), c = cats.size===1 ? catColor(ps[0]) : 'var(--accent)';
      const s = Math.round(12 + 5*Math.sqrt(ps.length));
      const icon = L.divIcon({className:'apin fort', iconSize:[s,s], html:`<span style="--c:${c}">${ps.length>1?ps.length:''}</span>`});
      L.marker(ll,{icon, title:`${label} · ${ps.length}`, riseOnHover:true}).bindPopup(fortunesPopup(label, ps), {maxWidth:320, className:'apop', autoPanPaddingTopLeft:[24,180], autoPanPaddingBottomRight:[24,60]}).addTo(g);
    }
  } else if (ATLAS.boi){
    const items = spread(boiVisible().map(r=>({r, g:geoFor(r)})).filter(x=>x.g).map(x=>({...x, ll:[x.g[0],x.g[1]]})));
    items.forEach(({r,g:geo,ll})=>{
      const icon = L.divIcon({className:'apin boi'+(geo[2]==='city'?' approx':''), iconSize:[14,14], html:`<span style="--c:${boiColor(r.category)}"></span>`});
      L.marker(ll,{icon, title:r.name, riseOnHover:true, keyboard:true}).bindPopup(boiPopup(r,geo),{maxWidth:300, className:'apop', autoPanPaddingTopLeft:[24,180], autoPanPaddingBottomRight:[24,60]}).addTo(g);
    });
  }
  renderAtlasBar(); atlasStatus(); renderOffList();
  if (fit || !ATLAS.fitted[ATLAS.layer]) {
    let b = g.getBounds();
    if (ATLAS.layer==='boi') {   // open on the Baltimore–DC corridor; outliers (e.g. Farmville, VA) stay one zoom-out away
      const core = L.latLngBounds([]); g.eachLayer(m=>{ const p=m.getLatLng(); if (p.lat>38.6 && p.lat<39.75 && p.lng>-77.6 && p.lng<-76.3) core.extend(p); });
      if (core.isValid()) b = core;
    }
    if (b.isValid()) { ATLAS.map.fitBounds(b.pad(ATLAS.layer==='boi'?0.08:0.15), {maxZoom: ATLAS.layer==='boi'?13:6, animate:false}); ATLAS.fitted[ATLAS.layer]=true; }
  }
}
async function renderAtlas(){
  document.getElementById('atlasLayer').hidden=false;
  if (!ATLAS.booting) ATLAS.booting = (async ()=>{
    await atlasLibs();
    ATLAS.geoLive = geoCache();
    ATLAS.map = L.map('atlasMap', {zoomControl:false, worldCopyJump:true, minZoom:2}).setView([39.0,-77.0], 4);
    L.control.zoom({position:'bottomright'}).addTo(ATLAS.map);
    ATLAS.map.on('popupopen', e=>e.popup.getElement()?.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>openNode(b.dataset.go)));
    new MutationObserver(()=>ATLAS.map&&atlasTiles()).observe(document.documentElement,{attributes:true, attributeFilter:['data-theme']});
    matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>ATLAS.map&&atlasTiles());
    ATLAS.places = await loadPlaces();
  })().catch(e=>{ document.getElementById('atlasStatus').textContent='The map library could not load. Check your connection and reload.'; throw e; });
  await ATLAS.booting;
  ATLAS.map.invalidateSize();
  if (ATLAS.layer==='boi' && !ATLAS.boi){ atlasStatus(); await loadBOI(); geocodeMissing(); }
  drawAtlas(false);
}
function bindAtlas(){
  document.getElementById('atlasLayer').addEventListener('click', e=>{
    const b=e.target.closest('[data-layer]'); if(!b || b.dataset.layer===ATLAS.layer) return;
    ATLAS.layer=b.dataset.layer; ATLAS.map?.closePopup(); renderAtlas();
  });
  document.getElementById('boiChips').addEventListener('click', e=>{
    const b=e.target.closest('[data-boi]'); if(!b) return; const c=b.dataset.boi;
    if (c==='__all') ATLAS.boiOff.clear();
    else if (ATLAS.boiOff.has(c)) ATLAS.boiOff.delete(c); else ATLAS.boiOff.add(c);
    drawAtlas(false);
  });
}

/* =====================================================================
   ROUTER  (#/web graph · #/map geographic · #/grid · #/overlaps · #/p/<id>)
   ===================================================================== */
function setView(v){
  state.view=v;
  document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===v));
  document.getElementById('map').hidden = v!=='map';
  document.getElementById('grid').hidden = v==='map'||v==='atlas';
  document.getElementById('atlas').hidden = v!=='atlas';
  document.querySelector('header.top .row2').hidden = v==='atlas' && ATLAS.layer==='boi';
  if(v==='map') renderMap(); else if(v==='overlaps') renderOverlaps(); else if(v==='atlas') renderAtlas(); else renderGrid();
}
/* URL names differ from internal view ids: the graph lives at #/web, the geographic map at #/map (#/atlas still works) */
const VIEW_HASH = {map:'web', atlas:'map', grid:'grid', overlaps:'overlaps'};
const HASH_VIEW = {web:'map', map:'atlas', atlas:'atlas', grid:'grid', overlaps:'overlaps'};
const hashOf = v => VIEW_HASH[v] || v;
const viewOfHash = () => HASH_VIEW[location.hash.replace(/^#\/?/,'').split('/')[0]] || null;
function route(){
  const [a,b]=location.hash.replace(/^#\/?/,'').split('/');
  const id=b?decodeURIComponent(b):'';
  if(a==='p' && DATA.byId[id]){ showDrawer(id); return; }
  hideDrawer();
  const v=HASH_VIEW[a]; if(v && v!==state.view) setView(v);
}

/* =====================================================================
   BOOT
   ===================================================================== */
(async function boot(){
  try{
    const r=await fetch('data.json',{cache:'no-store'});
    if(r.ok) DATA=normalize(await r.json());
  }catch(_){/* opened from file:// or no data.json — use embedded copy */}
  if(!DATA) DATA=normalize(EMBEDDED_DATA);
  DATA.ovl=computeOverlaps(DATA);
  DATA.nComm=computeCommunities(DATA);
  renderChips(); renderLegend(); bindUI();
  bindAtlas();
  setView(viewOfHash() || 'atlas');
  route();
})();
</script>
</body>
